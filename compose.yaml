# Uno Notetaker — meeting notes on your Uno computer.
#
#   docker compose up -d --build        → http://<computer>:8430
#
# On a Uno computer (Uno Work) it needs no setup: the app registers itself
# (~/.uno/apps/notetaker.json, with "ai" in it), Uno Work gives it its own AI
# key in ~/.uno/app-keys/notetaker/ and the app uses "the AI of this computer"
# through the local App API — metered per app, limit in Uno Work → Settings →
# Apps. Meetings go to ~/Meetings. ADMIN_PASSWORD is required — the App Store
# generates it and shows it on the app card.
#
# Only the two folders the app needs from ~/.uno are mounted. Never mount the
# whole ~/.uno: it holds the AI keys of every other app on the computer.
name: uno-notetaker
services:
  # Creates the folders the app mounts with the computer user as owner. Docker
  # would create a missing bind folder as root, and Uno Work (running as that
  # user) could then not write the app's key into it. Idempotent: existing
  # folders are left as they are.
  uno-dirs:
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        set -e
        o=$$(stat -c %u:%g /host)
        for d in /host/.uno /host/.uno/apps /host/.uno/app-keys; do
          [ -d "$$d" ] || { mkdir "$$d"; chown "$$o" "$$d"; }
        done
        d=/host/.uno/app-keys/notetaker
        [ -d "$$d" ] || { mkdir -m 700 "$$d"; chown "$$o" "$$d"; }
    volumes:
      - ${UNO_HOME:-/home/unowork}:/host
  notetaker:
    build: ./app
    image: uno-notetaker:0.3.0
    restart: unless-stopped
    depends_on:
      uno-dirs: {condition: service_completed_successfully}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
      UNO_APP_URL: ${UNO_APP_URL:-}
      # Fallback for computers whose Uno Work has no App API yet.
      UNO_LLM_API_KEY: ${UNO_LLM_API_KEY:-}
      UNO_LLM_BASE_URL: ${UNO_LLM_BASE_URL:-https://api.getuno.xyz/v1}
    # The App API listens on the host's loopback + docker bridge.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${UNO_HOME:-/home/unowork}/Meetings:/meetings
      # The manifest (the app appears on the Uno Work desktop and asks for AI).
      - ${UNO_HOME:-/home/unowork}/.uno/apps:/uno-dot/apps
      # This app's own AI key (token + api.json), read-only.
      - ${UNO_HOME:-/home/unowork}/.uno/app-keys/notetaker:/run/uno-app:ro
      # Fallback only (older Uno Work without the App API): the Uno Work state
      # dir, read-only, for the computer's gateway key in settings.json. A
      # directory, not the file: a missing file would be created by docker as
      # a folder and break Uno Work.
      - ${UNO_WORK_USERDATA:-/var/lib/uno-work/userdata}:/uno-work:ro
      - state:/state
    ports: ["8430:8430"]
    # A 1-hour meeting peaks ~250 MB (ffmpeg + app); local Whisper base adds ~0.5 GB.
    mem_limit: 1500m
volumes:
  state: {}
